<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14313B">
<title>GFD - Game for Dads</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EBE7; --surface:#FFFFFF; --surface-2:#F1F5F2; --ink:#14313B; --muted:#56696E; --line:#CBD6D1;
  --primary:#2C6E7F; --primary-ink:#FFFFFF; --energy:#3E9B4F; --hp:#D9483A; --gold:#B9810B; --gold-bg:#F2B533;
  --track:#D5DED9;
  --font-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"Fredoka", "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B20; --surface:#152830; --surface-2:#1B323A; --ink:#E3EDE9; --muted:#93AAA6; --line:#264149;
    --primary:#62B4C6; --primary-ink:#0E1B20; --energy:#5BC06B; --hp:#F06A57; --gold:#F2B533; --gold-bg:#F2B533;
    --track:#22393F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B20; --surface:#152830; --surface-2:#1B323A; --ink:#E3EDE9; --muted:#93AAA6; --line:#264149;
  --primary:#62B4C6; --primary-ink:#0E1B20; --energy:#5BC06B; --hp:#F06A57; --gold:#F2B533; --gold-bg:#F2B533;
  --track:#22393F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold-bg);outline-offset:2px}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* header */
#top{padding:10px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
#top:empty{display:none}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:42px;height:42px;border-radius:10px;overflow:hidden;flex:none}
.who .av svg,.bigav svg,.preview svg{display:block;width:100%;height:100%}
.who .name{font-weight:700;line-height:1.15;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .title{font-size:13px;color:var(--muted)}
.coins{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--gold)}
.coins svg{width:20px;height:20px}
.bars{margin-top:10px;display:grid;gap:7px}
.bar{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px}
.bicon svg{width:18px;height:18px;display:block}
.bar.energy .bicon{color:var(--energy)} .bar.hp .bicon{color:var(--hp)}
.track{height:11px;background:var(--track);border-radius:3px;overflow:hidden}
.fill{height:100%;transition:width .25s}
.bar.energy .fill{background:var(--energy)} .bar.hp .fill{background:var(--hp)}
.idleline{margin-top:7px;padding-left:28px;font-size:13px;font-weight:700;color:var(--primary)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.barnum{font-variant-numeric:tabular-nums;font-family:var(--font-num);font-size:18px;font-weight:700;min-width:86px;text-align:right;align-self:start;line-height:1.1}
.barnum small{font-size:13px;color:var(--muted);font-weight:500}

/* main */
main{flex:1;overflow-y:auto;padding:16px 14px 28px;-webkit-overflow-scrolling:touch}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.skill h2{margin:0;font-size:22px;line-height:1.1}
.xpline{font-size:13px;color:var(--muted)}
.lvl{font-family:var(--font-num);font-size:46px;line-height:.85;font-weight:700;color:var(--primary)}
.xpbar{grid-column:1/-1;height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:8px}
.xpbar div{height:100%;background:var(--primary)}
.skill.compact h2{font-size:17px}
.skill.compact .lvl{font-size:32px}
.skill.compact .xpline{font-size:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.duo.quad{gap:12px 18px}
.duo.quad .lvl{font-size:28px}
.duo.quad h2{font-size:16px}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px}
.chip.style{min-height:50px;border-radius:12px;padding:4px 6px;font-weight:700;line-height:1.15}
.chip.style small{display:block;font-weight:400;font-size:12px;opacity:.85}

.stage{margin:20px 0 26px}
.stage-title{margin:0;font-size:19px;font-weight:700}
.stage-meta{margin:2px 0 0;color:var(--muted);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:58px;border-radius:12px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:18px;line-height:1.1;padding:6px 10px}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.btn.alt{background:transparent;color:var(--primary)}
.btn.wide{grid-column:1/-1}
.btn.idle{background:transparent;color:var(--ink);border-style:dashed}
.btn.idle.on{border-style:solid;background:var(--surface-2);color:var(--primary)}
.sbtn.idle{border-style:dashed}
.sbtn.idle.on{border-style:solid;background:var(--surface-2)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;margin:18px 0 6px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fighter{min-width:0}
.portrait{position:relative;aspect-ratio:1;width:100%;max-width:120px;margin:0 auto;border-radius:16px;overflow:visible;transition:opacity .3s,filter .3s}
.portrait>svg{display:block;width:100%;height:100%;border-radius:16px}
.portrait.foe{display:flex;align-items:center;justify-content:center}
.emo{font-size:58px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.portrait.down{opacity:.35;filter:grayscale(1)}
.portrait.hurt{animation:hurt .18s}
@keyframes hurt{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.vs{align-self:center;font-family:var(--font-num);font-weight:700;color:var(--muted);font-size:18px;padding-bottom:30px}
.hpbar{height:9px;margin:9px auto 0;max-width:120px;background:#C62A1E;border-radius:3px;overflow:hidden}
.hpbar div{height:100%;background:#3FAE49;transition:width .15s}
.fname{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:5px;font-size:14px;line-height:1.2}
.fname span{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname b{font-family:var(--font-num);font-size:16px;color:var(--muted)}
.arena-msg{grid-column:1/-1;margin:4px 0 0;text-align:center;font-weight:700;min-height:21px;font-size:15px}
.k-muted{color:var(--muted);font-weight:400}
.splat{position:absolute;width:42px;height:42px;transform:translate(-50%,-50%);pointer-events:none;z-index:2;animation:splat .75s ease-out forwards}
.splat svg{position:absolute;inset:0;width:100%;height:100%}
.splat.hit polygon{fill:#C62A1E;stroke:#6E1209;stroke-width:1.6}
.splat.miss polygon{fill:#2F6FD6;stroke:#173E85;stroke-width:1.6}
.splat span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-num);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.5)}
@keyframes splat{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}28%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.stage.tight{margin-top:8px}
.rate{font-family:var(--font-num);font-weight:700;font-size:17px;white-space:nowrap}
.rare{color:var(--gold)}
.small.note{margin:-4px 0 10px}
.odds{margin:10px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:14px}
.odds p{margin:0}
.odds.sep{margin:0 0 22px}
.odds p+p{margin-top:3px}
.odds .why{color:var(--muted);font-size:13px;margin-top:6px}
.small.kc{margin:-12px 0 24px}
.btn.red{border-color:var(--hp);color:var(--hp);background:transparent}
.btn:disabled,.sbtn:disabled{opacity:.4}
.btn:not(:disabled):active,.sbtn:not(:disabled):active{transform:translateY(1px)}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.hint+.sect{margin-top:16px}

.sect{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.pick{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px 12px 18px;position:relative}
.pick+.pick{border-top:1px solid var(--line)}
.pick .pn{font-weight:700;display:block}
.pick .pm{font-size:13px;color:var(--muted);display:block}
.pick[aria-pressed="true"]{background:var(--surface-2)}
.pick[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:0 4px 4px 0;background:var(--primary)}
.pick:disabled .pn{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px}
.row+.row{border-top:1px solid var(--line)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:700}
.row-meta{font-size:13px;color:var(--muted)}
.count{font-family:var(--font-num);font-size:20px;font-weight:700;min-width:34px;text-align:right}
.row-btns{display:flex;gap:6px}
.sbtn{min-height:40px;min-width:52px;padding:0 10px;border-radius:9px;border:1.5px solid var(--primary);background:transparent;color:var(--primary);font-weight:700;font-size:14px}
.sbtn.solid{background:var(--primary);color:var(--primary-ink)}
.empty{padding:16px 14px;color:var(--muted);font-size:15px}
.empty button{margin-top:8px}

/* shop */
.upgrade{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:22px}
.upgrade .big{font-family:var(--font-num);font-size:36px;font-weight:700;line-height:1;margin:6px 0 2px}
.upgrade .big span{color:var(--energy)}
.costline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:12px 0 6px}
.costline b{color:var(--gold);font-family:var(--font-num);font-size:18px}
.upgrade .track .fill{background:var(--gold-bg)}
.upgrade .btn{width:100%;margin-top:14px}

/* dad card */
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.dhero{display:flex;align-items:center;gap:14px;padding:16px;color:#14313B}
.bigav{width:96px;height:96px;border-radius:16px;overflow:hidden;border:3px solid #fff;flex:none}
.dname{font-family:var(--font-num);font-size:30px;line-height:1;font-weight:700;word-break:break-word}
.dtitle{font-weight:700;margin-top:6px}
.dtotal{font-size:14px}
.dskills{padding:2px 16px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.dskill{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:10px 0}
.dskill:nth-child(n+3){border-top:1px solid var(--line)}
.dskill .lv{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--primary);line-height:1}
.dskill .mini{grid-column:1/-1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.dskill .mini div{height:100%;background:var(--primary)}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.dstats div{padding:12px 6px;text-align:center}
.dstats div+div{border-left:1px solid var(--line)}
.dstats b{display:block;font-family:var(--font-num);font-size:20px}
.dstats span{font-size:12px;color:var(--muted)}
.dfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.dfoot b{font-family:var(--font-num);font-size:16px;color:var(--ink)}
.stack{display:grid;gap:10px}
details.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:16px}
details.tools summary{padding:14px 0;font-weight:700;cursor:pointer}
details.tools .inner{padding-bottom:16px;display:grid;gap:10px}
textarea{width:100%;min-height:84px;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.small{font-size:13px;color:var(--muted);margin:0}

/* editor / setup */
.brand{text-align:center;margin:8px 0 18px}
.brand h1{font-family:var(--font-num);font-size:88px;line-height:.9;margin:0;color:var(--primary);letter-spacing:1px}
.brand p{margin:6px 0 0;font-size:17px;color:var(--muted)}
.preview{width:128px;height:128px;border-radius:20px;overflow:hidden;margin:0 auto 6px;border:3px solid var(--surface)}
.field{margin:16px 0}
.field .lab{display:block;font-weight:700;margin-bottom:7px}
input[type=text]{width:100%;min-height:48px;font:inherit;font-size:17px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}
.dot[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:2px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ticker + nav */
#ticker{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface-2);font-size:14px;padding:8px 14px;min-height:40px}
#ticker[hidden]{display:none}
#ticker p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker ul{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}
#ticker li{padding:5px 0}
#ticker li+li{border-top:1px dashed var(--line);color:var(--muted)}
.k-lvl{color:var(--gold);font-weight:700}
.k-warn{color:var(--hp)}
nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav:empty{display:none}
nav button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--primary);font-weight:700}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}

/* feedback */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--primary);white-space:nowrap;animation:rise .9s ease-out forwards;text-shadow:0 1px 0 var(--surface),0 -1px 0 var(--surface)}
.pop.gold{color:var(--gold)} .pop.green{color:var(--energy)} .pop.red{color:var(--hp)}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:var(--gold-bg);color:#231804;font-family:var(--font-num);font-weight:700;font-size:21px;padding:10px 18px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:50;white-space:nowrap;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.sheet{position:absolute;inset:0;z-index:70;background:rgba(8,18,22,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.sheet img{display:block;max-width:100%;max-height:64vh;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sheet p{margin:0;color:#fff;font-size:14px;text-align:center}
.sheet .stack{width:100%;max-width:340px}
.sheet .btn.alt{background:var(--surface)}
.idlecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0 0}
.idlecard+.idlecard{margin-top:10px}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog-track{flex:1;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--primary);transition:width 1s linear}
.prog-t{font-size:13px;color:var(--muted);white-space:nowrap}
.prog-t b{font-family:var(--font-num);font-size:15px;color:var(--ink)}
.idlecard + .small.note{margin:10px 0 20px}
.taskline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;width:100%;margin:12px 0 0;padding:10px 14px;border:1.5px solid var(--gold-bg);border-radius:12px;background:transparent;text-align:left}
.taskline span{font-size:13px;color:var(--muted)}
.taskline b{font-family:var(--font-num);font-size:17px}
.foe-row{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.foe-row+.foe-row{border-top:1px solid var(--line)}
.foe-row.task{box-shadow:inset 4px 0 0 var(--gold-bg)}
.foe-row .row-meta+.row-meta{margin-top:3px}
.foe-ic{flex:none;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.foe-ic.big{width:64px;height:64px;font-size:38px;border-radius:14px}
.lvtag{font-size:12px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.lvtag.task{color:var(--gold);border-color:var(--gold-bg)}
.hpbar.empty{background:var(--track)}
.hpbar.empty div{background:var(--track)}
.taskhead{display:flex;align-items:center;gap:14px;margin:8px 0 12px}
.taskhead .big{margin:0}
.big .of{font-size:22px;color:var(--muted)}
.pts{font-family:var(--font-num);font-size:18px;color:var(--gold)}
.upgrade .track .fill{background:var(--gold-bg)}
.st{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--surface-2);font-family:var(--font-num);font-weight:600;font-size:15px;line-height:1.3;white-space:nowrap;vertical-align:middle}
.st svg{width:14px;height:14px;flex:none}
.st.hp svg{color:var(--hp)}
.st.gold svg{color:var(--gold)}
.stats-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 5px}
.kc-tag{font-size:12px;color:var(--muted);margin-left:auto}
.legend .st{padding:2px 6px;margin:0 2px}
.fstats{display:flex;justify-content:center;gap:5px;margin-top:6px}
.fstats .st{font-size:14px;padding:1px 7px 1px 6px}
.odds .st{padding:1px 5px;font-size:13px}
.wbadge{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:2px solid var(--gold-bg);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.wname{display:block;font-style:normal;font-size:12px;color:var(--gold);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dweapon{margin-top:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.55);border-radius:8px;padding:3px 8px;display:inline-block}
.foe-ic.dim{background:var(--surface-2);opacity:.6}
.row-name.muted{color:var(--muted)}
.warnbox{border-color:var(--gold-bg);border-width:1.5px}
.warnbox textarea{margin-top:8px}
.hs-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}
.chip.hs{flex:none;min-height:34px;padding:0 12px;font-size:14px}
.hs-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.hs-row+.hs-row{border-top:1px solid var(--line)}
.hs-row.me{background:var(--surface-2)}
.hs-rank{font-family:var(--font-num);font-weight:700;font-size:18px;width:22px;text-align:center;color:var(--muted)}
.hs-row:nth-child(1) .hs-rank{color:var(--gold)}
.hs-av{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none}
.hs-av svg{display:block;width:100%;height:100%}
.hs-val{font-family:var(--font-num);font-weight:700;font-size:22px;color:var(--primary)}
.idlecard.active{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.small.note.doing{margin:14px 0 0;font-size:14px}
.idleline b{font-family:var(--font-num)}
.cloudbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;text-decoration:none}
#cloudLine b{font-weight:700;color:var(--ink)}
.linkbtn.dl{display:flex;align-items:center;justify-content:center;text-decoration:none}
#cloudLine:empty{display:none}
.codebox{display:flex;align-items:center;gap:10px;margin-top:6px}
.code{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:.5px;background:var(--surface-2);border-radius:8px;padding:9px 10px;word-break:break-all}
#cloudCodeBox{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
nav button span{white-space:nowrap}
.pagetitle{margin:0 0 6px;font-size:22px}
.newscard{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px 18px 16px;width:100%;max-width:380px;max-height:78vh;overflow-y:auto;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.sheet .newscard .news-kicker{margin:0 0 8px;font-family:var(--font-num);font-weight:700;font-size:24px;color:var(--primary);text-align:left}
.newscard h2{font-size:16px;margin:12px 0 6px}
.newscard ul{margin:0;padding-left:20px}
.newscard li{margin:0 0 7px;font-size:15px;line-height:1.4}
.updatebar{display:block;width:100%;margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:var(--gold-bg);color:#231804;font-weight:700;font-size:14px;text-align:left}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate b{display:block;font-family:var(--font-num);font-size:40px;color:var(--primary)}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <button id="ticker" type="button" aria-expanded="false" hidden></button>
  <nav id="nav" aria-label="Game sections"></nav>
</div>
<div id="fx" aria-hidden="true"></div>
<div id="rotate"><div><b>GFD</b>Turn your phone upright. GFD is played in portrait.</div></div>

<script src="engine.js"></script>
<script>
/* ---------- What's New ----------
   Shown once after an update. To announce an update: bump CONFIG.version and add an entry at the TOP. */
const CHANGELOG = [
  {v: '0.16.1', title: 'Always the newest version', notes: [
    'GFD now checks for updates by itself and reloads to the newest version. No more playing on an old copy that can\'t save.',
    'Played on an old version after the server move? That progress didn\'t count, sorry. Your real dad is safe on the server.',
  ]},
  {v: '0.16', title: 'Your dad moved to the server', notes: [
    'Every catch, fight, drop and coin is now decided on the server, not on your phone. No more cheating: the <b>Ranks</b> are 100% honest.',
    'Your progress came along. Nothing lost.',
    'Your <b>cloud code</b> is now the only key to your dad. Copy it from the Dad tab and keep it safe: type it on any phone and he\'s back. The old long save codes are gone.',
    'You need internet to play. While your phone is off, your dad keeps fishing on the server for as long as your idle time lasts.',
  ]},
  {v: '0.15', title: 'Ranks, fast cooking and this very popup', notes: [
    'Highscores moved to their own tab: <b>Ranks</b>. Plenty of room for every dad in the neighbourhood.',
    'Cooking is much faster: one try every <b>5 seconds</b> instead of a minute. Cook your whole catch in no time, then your dad goes back to fishing by himself.',
    "This <b>What's New</b> popup. You'll see it once after every update, so you always know what changed.",
  ]},
  {v: '0.14', title: 'Cloud saves', notes: [
    'Your dad now saves to the cloud. Find your <b>cloud code</b> on the Dad tab and copy it somewhere safe: type it on any phone and your dad comes back.',
    'Live highscores for all dads.',
  ]},
];
const verNum = v => String(v || '0').split('.').reduce((a, x, i) => a + (+x || 0) / Math.pow(1000, i), 0);
function showWhatsNew(sinceV, all) {
  const list = all ? CHANGELOG : sinceV ? CHANGELOG.filter(c => verNum(c.v) > verNum(sinceV)) : CHANGELOG.slice(0, 2);
  if (!list.length) return;
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', "What's new");
  el.innerHTML = `<div class="newscard"><p class="news-kicker">What's new in GFD</p>
    ${list.map(c => `<section><h2>v${c.v}: ${c.title}</h2><ul>${c.notes.map(n => `<li>${n}</li>`).join('')}</ul></section>`).join('')}
    <button class="btn" style="width:100%;margin-top:6px" data-act="closeShare">Got it</button></div>`;
  $('#app').appendChild(el);
  lsSet(LS.seen, CONFIG.version);
}

const $ = s => document.querySelector(s);

/* ---------- avatar ---------- */
function shade(hex, a) { const n = parseInt(hex.slice(1), 16);
  const f = v => Math.round(v * (1 - a)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function isDark(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11) < 120; }

function avatarSVG(L) {
  const skin = LOOKS.skin[L.skin] || LOOKS.skin[0], hair = LOOKS.hairColor[L.hairColor] || LOOKS.hairColor[0];
  const shirt = LOOKS.shirt[L.shirt] || LOOKS.shirt[0], bg = LOOKS.bg[L.bg] || LOOKS.bg[0], sd = shade(skin, .16);
  const sides = `<path d="M19.3 28 C18.8 22 19.6 19 21 17.5 L22 28Z" fill="${hair}"/><path d="M44.7 28 C45.2 22 44.4 19 43 17.5 L42 28Z" fill="${hair}"/>`;
  let top = '', cap = '';
  if (L.hair === 'mohawk') top = `<path d="M20.2 24 C20 17 25 13.6 32 13.6 C39 13.6 44 17 43.8 24 C41.5 19.5 37.5 17.5 32 17.5 C26.5 17.5 22.5 19.5 20.2 24Z" fill="${hair}" opacity=".25"/><path d="M26.6 18 L27.2 9.5 L29.2 11.8 L30.2 3.4 L32.2 9 L34 3.8 L34.9 10.6 L37 8.2 L37.4 18 C35.6 16.6 33.8 16.1 32 16.1 C30.2 16.1 28.4 16.6 26.6 18Z" fill="${hair}"/>`;
  if (L.hair === 'short') top = `<path d="M19.3 27 C18.5 16 23.5 11.5 32 11.5 C40.5 11.5 45.5 16 44.7 27 C43.6 21.5 41 19 37 18.6 C33 18.2 29 19.4 25 18.8 C22 19.6 20.2 22.5 19.3 27Z" fill="${hair}"/>`;
  if (L.hair === 'messy') top = `<path d="M19 27 C17.5 18 21 12.5 26 11 L27 7.5 L30 10.5 L33 7 L35.2 10.6 L39.5 8.2 L39.8 12.4 C44.2 14.6 46.5 20 45 27 C43.5 22 40 19.5 35 20.5 L33 18 L30 20.5 C26 19 21.5 21 19 27Z" fill="${hair}"/>`;
  if (L.hair === 'thinning') top = sides + `<path d="M29 13.4 C31 12.6 33 12.6 35 13.4 C33 14.4 31 14.4 29 13.4Z" fill="${hair}"/>`;
  if (L.hair === 'bald') top = `<ellipse cx="26.5" cy="17" rx="3.6" ry="2" fill="#fff" opacity=".35"/>`;
  if (L.hair === 'cap') { top = sides; const cd = shade(shirt, .28);
    cap = `<path d="M18.8 22 C18.8 13.5 24.5 9.5 32 9.5 C39.5 9.5 45.2 13.5 45.2 22Z" fill="${shirt}"/><path d="M18.3 21.2 L46 21.2 C49 21.2 51.5 22.2 51.5 23.6 L18.3 23.6Z" fill="${cd}"/><circle cx="32" cy="9.8" r="1.4" fill="${cd}"/>`; }
  let beard = '';
  const jaw = 'M19.6 29 C19.8 40 25 44.5 32 44.5 C39 44.5 44.2 40 44.4 29 C42.8 34.5 40 36.3 36.5 35.6 C34.5 35.2 33 34.6 32 34.6 C31 34.6 29.5 35.2 27.5 35.6 C24 36.3 21.2 34.5 19.6 29Z';
  if (L.beard === 'full') beard = `<path d="${jaw}" fill="${hair}"/>`;
  if (L.beard === 'stubble') beard = `<path d="M19.8 29.5 A12.5 14 0 0 0 44.2 29.5 C42.6 34.2 39.8 36 36.4 35.4 C34.6 35.1 33.2 34.5 32 34.5 C30.8 34.5 29.4 35.1 27.6 35.4 C24.2 36 21.4 34.2 19.8 29.5Z" fill="${hair}" opacity=".3"/>`;
  if (L.beard === 'mustache') beard = `<path d="M25.6 36.4 C27 33.6 30.2 33.4 32 34.6 C33.8 33.4 37 33.6 38.4 36.4 C36.8 37.1 34.6 36.7 32 35.9 C29.4 36.7 27.2 37.1 25.6 36.4Z" fill="${hair}"/>`;
  if (L.beard === 'handlebar') beard = `<path d="M23.6 32.6 C22.4 35.4 24.2 37.6 27 37 C28.8 36.6 30.6 35.8 32 36.3 C33.4 35.8 35.2 36.6 37 37 C39.8 37.6 41.6 35.4 40.4 32.6 C40.6 34.4 39.4 35.3 37.8 34.9 C35.8 34.4 33.8 33.4 32 34.2 C30.2 33.4 28.2 34.4 26.2 34.9 C24.6 35.3 23.4 34.4 23.6 32.6Z" fill="${hair}"/>`;
  if (L.beard === 'walrus') beard = `<path d="M24.8 35.8 C25 33.4 28.4 32.8 32 33.8 C35.6 32.8 39 33.4 39.2 35.8 C39.4 38.4 38.6 40.4 37.8 40.6 C37.2 39.2 36 38.6 34.6 38.8 C33.6 38.9 32.8 38.6 32 38.2 C31.2 38.6 30.4 38.9 29.4 38.8 C28 38.6 26.8 39.2 26.2 40.6 C25.4 40.4 24.6 38.4 24.8 35.8Z" fill="${hair}"/>`;
  const mouth = (L.beard === 'full' && isDark(hair)) ? '#F1D3C4' : '#6E3528';
  const glasses = L.glasses ? `<g fill="#fff" fill-opacity=".18" stroke="#1E2427" stroke-width="1.3"><rect x="23" y="25" width="8" height="6" rx="2"/><rect x="33" y="25" width="8" height="6" rx="2"/><path d="M31 27.5 H33 M23 27 L19.8 26 M41 27 L44.2 26" fill="none"/></g>` : '';
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar">
<rect width="64" height="64" fill="${bg}"/>
<path d="M10 64 C10 51 19 45 32 45 C45 45 54 51 54 64Z" fill="${shirt}"/>
<rect x="27" y="36" width="10" height="11" rx="3" fill="${sd}"/>
<path d="M27.5 45 L32 50.5 L36.5 45Z" fill="${sd}"/>
<circle cx="19.5" cy="29" r="3.2" fill="${skin}"/><circle cx="44.5" cy="29" r="3.2" fill="${skin}"/>
<ellipse cx="32" cy="27" rx="12.5" ry="14" fill="${skin}"/>
${top}
<path d="M24.6 24.4 Q27 23.2 29.4 24.4 M34.6 24.4 Q37 23.2 39.4 24.4" stroke="${hair}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<circle cx="27" cy="28" r="1.7" fill="#1D1D1D"/><circle cx="37" cy="28" r="1.7" fill="#1D1D1D"/>
<path d="M32 29 Q30.6 32.5 32.6 33" stroke="${sd}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
${beard}
${L.beard === 'walrus' ? '' : `<path d="M29.2 37.8 Q32 39.8 34.8 37.8" stroke="${mouth}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`}
${glasses}${cap}
</svg>`;
}

/* ---------- icons ---------- */
const ICON = {
  coin: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/></svg>`,
  bolt: `<svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z" fill="currentColor"/></svg>`,
  heart: `<svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.6C20.5 15.8 12 21 12 21z" fill="currentColor"/></svg>`,
  dad: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>`,
  fish: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.5 12c3.2-5 9.5-6.2 14.5-2l4.5-3.2v10.4L17 14c-5 4.2-11.3 3-14.5-2z"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg>`,
  pan: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="13.5" r="6.5"/><path d="M15.6 9.8 22 5.5"/></svg>`,
  sword: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5 9 15M20.5 3.5h-4.2M20.5 3.5v4.2M6.5 12.5l5 5M4 20l3.5-3.5"/></svg>`,
  target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>`,
  trophy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6M10 17h4"/></svg>`,
  shop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h16l-1.2 11H5.2z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2" stroke-linecap="round"/></svg>`,
};


/* ---------- state: the server owns your dad. S is just the last copy it sent us ---------- */
let S = null;                 // null until there's a dad
let draft = null, editing = false, tickerOpen = false, resetArmed = 0, ioMsg = '';
let anim = null, arenaMsg = null;   // anim = fight being replayed; arenaMsg = last result under the arena
const LS = {code: 'gfd_code', cache: 'gfd_cache', tab: 'gfd_tab', copied: 'gfd_code_copied', seen: 'gfd_seen', legacy: 'gfd_save_v1', moved: 'gfd_moved'};
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, String(v)); } catch (e) {} };
const myCode = () => lsGet(LS.code);
// keeps a copy on the phone so the game opens instantly; the server's copy is the real one
function save() { if (S) lsSet(LS.cache, JSON.stringify(S)); }

/* ---------- feedback ---------- */
const toastQ = []; let toastBusy = false;
function toast(text) { toastQ.push(text); if (!toastBusy) nextToast(); }
function nextToast() { const t = toastQ.shift(); if (!t) { toastBusy = false; return; } toastBusy = true;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
  $('#app').appendChild(el); setTimeout(() => { el.remove(); nextToast(); }, toastQ.length > 1 ? 1100 : 1800); }
function pop(text, btn, color = '') {
  if (!btn || !btn.isConnected) return; const r = btn.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'pop ' + color; el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top - 8) + 'px';
  $('#fx').appendChild(el); setTimeout(() => el.remove(), 950);
}


// eating or drinking mid-fight ends it: you keep the damage taken so far, the enemy gets away, no rewards
function stopFight() {
  if (!anim) return; clearInterval(anim.timer); anim = null;   // the heal request that follows makes the server stop the fight
}

/* ---------- rendering ---------- */
function regenText(v, max, at) {
  if (v >= max) return 'Full';
  const next = Math.max(0, at + CONFIG.regenMs - now()), full = (max - v - 1) * CONFIG.regenMs + next;
  return `+1 in ${clock(next)}, full in ${dur(full)}`;
}
function barHTML(kind, icon, v, max, sub, label) {
  return `<div class="bar ${kind}" aria-label="${label} ${v} of ${max}"><span class="bicon">${icon}</span>
  <div><div class="track"><div class="fill" style="width:${Math.min(100, v / max * 100)}%"></div></div><div class="sub">${sub}</div></div>
  <div class="barnum">${fmt(v)}<small>/${fmt(max)}</small></div></div>`;
}
function idleLine() {
  const a = S.activity, c = cookPick(), tk = tradePick();
  const what = a === 'fish' ? `fishing ${FISH[S.spot].name}` : a === 'cook' ? (c >= 0 ? `cooking ${FISH[c].name}` : 'cooking') : a === 'trade' ? (tk ? `selling ${lootInfo(tk).name}` : 'trading') : `fighting in ${AREAS[S.area].place}`;
  return `Idle: ${what}, next in <b id="actBarH"></b>`;
}
function renderTop() {
  if (!S || editing === 'setup') { $('#top').innerHTML = ''; return; }
  const mh = anim ? anim.mh : maxHP(), hpNow = anim ? anim.php : S.hp, coinsNow = anim ? anim.coins0 : S.coins;
  $('#top').innerHTML = `<div class="who"><div class="av">${avatarSVG(S.look)}</div>
    <div><div class="name">${esc(S.name)}</div><div class="title">${dadTitle()}</div></div>
    <div class="coins" aria-label="${fmt(coinsNow)} coins">${ICON.coin}<span>${fmt(coinsNow)}</span></div></div>
    <div class="bars">${barHTML('hp', ICON.heart, hpNow, mh, anim ? 'Fighting' : regenText(S.hp, mh, S.hpAt), 'Health')}</div>
    <div class="idleline">${idleLine()}</div>
    ${updateReady ? `<button class="updatebar" data-act="reloadApp">New version ${esc(updateReady)} is ready. Tap to update</button>` : ''}`;
  updateProgress();
}
// progress bars for the next fishing cast / cooking attempt / idle fight, updated every second
function updateProgress() {
  const set = (id, at, ms) => { const el = document.getElementById(id); if (!el) return;
    el.style.width = clamp((now() - at) / ms * 100, 0, 100) + '%';
    const lab = document.getElementById(id + 'T'); if (lab) lab.textContent = clock(at + ms - now()); };
  set('actBar', S.actAt, actMs(S.activity));
  const h = document.getElementById('actBarH'); if (h) h.textContent = clock(S.actAt + actMs(S.activity) - now());
}
function skillHTML(k, compact) {
  const x = S.xp[k], l = lvl(k), lo = XP_FOR[l], hi = l < 100 ? XP_FOR[l + 1] : lo;
  const w = l < 100 ? (x - lo) / (hi - lo) * 100 : 100;
  return `<section class="skill${compact ? ' compact' : ''}"><div><h2>${SKILLS[k]}</h2>
    <div class="xpline">${l < 100 ? `${fmt(hi - x)} xp to level ${l + 1}` : 'Max level'}</div></div>
    <div class="lvl" aria-label="Level ${l}">${l}</div><div class="xpbar"><div style="width:${w}%"></div></div></section>`;
}
// show what's unlocked plus the next locked thing as a goal, nothing more
const visibleCount = (list, level) => Math.min(list.length, list.filter(x => x.req <= level).length + 1);
const progHTML = (id, label) => `<div class="prog"><div class="prog-track"><div class="prog-fill" id="${id}"></div></div><span class="prog-t">${label} <b id="${id}T"></b></span></div>`;

// a "switch to this" button for an idle activity that isn't running
const actBtn = (a, label, why) => `<button class="btn alt" style="width:100%;margin-top:10px" data-act="activity" data-a="${a}" ${why ? 'disabled' : ''}>${label}<small>${why || `Stops ${ACT[S.activity]}`}</small></button>`;
const doingNow = () => `<p class="small note doing">Right now your dad is <b>${ACT[S.activity]}</b>.</p>`;
function fishTab() {
  const i = S.spot, f = FISH[i], L = lvl('fishing'), c = cookPick(), mh = maxHP();
  const spots = FISH.slice(0, visibleCount(FISH, L)).map((x, j) => { const locked = L < x.req;
    return `<button class="pick" data-act="spot" data-i="${j}" aria-pressed="${j === i}" ${locked ? 'disabled' : ''}>
      <span class="pn">${x.name}</span><span class="pm">${locked ? `Opens at Fishing ${x.req}` : `${pct(catchChance(j))} catch, ${x.xp} xp, heals ${x.heal} when cooked`}</span></button>`; }).join('');
  const food = FISH.map((x, j) => [x, j]).filter(([x, j]) => S.cooked[j] > 0).map(([x, j]) =>
    `<div class="row"><span class="count">${S.cooked[j]}</span><div class="row-main"><div class="row-name">${x.name}</div><div class="row-meta">Heals ${x.heal} health each</div></div>
      <div class="row-btns"><button class="sbtn" data-act="eat" data-i="${j}" ${S.hp >= mh ? 'disabled' : ''}>Eat</button>
      <button class="sbtn solid" data-act="eatAll" data-i="${j}" ${S.hp >= mh ? 'disabled' : ''}>Eat all</button></div></div>`).join('');

function taskBanner() {

  try { legacy = JSON.parse(decodeURIComponent(escape(atob(String(raw).trim().replace(/^GFD1\./, ''))))); } catch (e) {}
  if (!legacy || !legacy.xp) { ioMsg = "That save code didn't work. Copy the whole code, including GFD1 at the start."; renderMain(); return; }
  const code = cleanCode(legacy.cloudCode) || newCloudCode();
  const res = await act('sync', {}, null, {legacy}, code);
  if (res && res.ok) { lsSet(LS.code, code); ioMsg = ''; toast(`Welcome back, ${S.name}!`); render(); }
  else { ioMsg = res && res.reason === 'no_dad' ? 'The server could not take that save over. The move window may have closed.' : "Couldn't reach the server. Try again."; renderMain(); }
}
async function loadScores() {
  try { const r = await rpc('gfd_leaderboard', {}); if (r && r.ok) { cloud.scores = (r.rows || []).map(x => cleanScore(x.player_id, x)).filter(Boolean); cloud.scoresAt = now(); renderCloudBits(); } }
  catch (e) { /* board just stays as it was */ }
}
// other dads' rows are their input: clean every field before showing it
function cleanScore(id, d) {
  if (!d || typeof d !== 'object') return null;
  const n = (v, max) => clamp(Math.floor(+v || 0), 0, max), lv = {};
  for (const k in SKILLS) lv[k] = n((d.lv || {})[k], 100) || 1;
  const L = d.look || {}, look = {skin: n(L.skin, LOOKS.skin.length - 1), hair: LOOKS.hair.includes(L.hair) ? L.hair : 'short', hairColor: n(L.hairColor, LOOKS.hairColor.length - 1),
    beard: LOOKS.beard.includes(L.beard) ? L.beard : 'none', glasses: !!L.glasses, shirt: n(L.shirt, LOOKS.shirt.length - 1), bg: n(L.bg, LOOKS.bg.length - 1)};
  const w = Math.floor(+d.weapon);
  return {id, name: String(d.name || 'Dad').slice(0, 16), look, lv, total: Object.values(lv).reduce((a, b) => a + b, 0),
    combat: Math.floor((lv.attack + lv.strength + lv.defence + lv.hitpoints) / 4), kills: n(d.kills, 1e12), tasks: n(d.tasks, 1e6), weapon: w >= 0 && w < 10 ? w : -1, at: +d.at || 0};
}
const HS_SORTS = [['total', 'Total'], ['combat', 'Combat'], ...Object.keys(SKILLS).map(k => [k, SKILLS[k]]), ['kills', 'Kills']];
const hsValue = (r, k) => k === 'total' || k === 'combat' || k === 'kills' ? r[k] : r.lv[k];
function highscoresHTML() {
  if (!cloud.scoresAt && !cloud.checked) return '<p class="small">Loading the highscores...</p>';
  if (!cloud.scoresAt) return '<div class="upgrade"><p class="small">Couldn\'t load the highscores right now. They\'ll show up when you\'re back online.</p></div>';
  const rows = cloud.scores.slice().sort((a, b) => hsValue(b, hsSort) - hsValue(a, hsSort) || b.total - a.total);
  const chips = HS_SORTS.map(([k, label]) => `<button class="chip hs" data-act="hsSort" data-s="${k}" aria-pressed="${hsSort === k}">${label}</button>`).join('');
  const list = rows.map((r, i) => `<div class="hs-row${r.id === cloud.playerId ? ' me' : ''}"><span class="hs-rank">${i + 1}</span>
      <span class="hs-av">${avatarSVG(r.look)}</span><div class="row-main"><div class="row-name">${esc(r.name)}${r.weapon >= 0 ? ` <span title="${esc(AREAS[r.weapon].weapon.name)}">${AREAS[r.weapon].weapon.icon}</span>` : ''}${r.id === cloud.playerId ? ' <span class="lvtag">you</span>' : ''}</div>
      <div class="row-meta">${titleFor(r.total)}, combat ${r.combat}${r.at ? `, played ${ago(r.at)}` : ''}</div></div>
      <span class="hs-val">${fmt(hsValue(r, hsSort))}</span></div>`).join('');
  return `<div class="hs-chips">${chips}</div><div class="panel">${list || '<div class="empty">No dads on the board yet. You could be first.</div>'}</div>`;
}
function installHTML() {
  if (standalone()) return '';
  if (installEvt) return '<button class="btn alt" style="width:100%;margin-top:12px" data-act="install">Install GFD as an app<small>Own icon, full screen, no browser bars</small></button>';
  if (/iphone|ipad/i.test(navigator.userAgent)) return '<p class="small note" style="margin-top:12px">Want GFD as an app? In Safari tap the Share button, then "Add to Home Screen".</p>';
  return '';
}
const syncedAgo = () => cloud.lastSync ? (now() - cloud.lastSync < 90000 ? 'just now' : now() - cloud.lastSync < 3600000 ? Math.round((now() - cloud.lastSync) / 60000) + ' min ago' : ago(cloud.lastSync)) : 'soon';
// the box on the Dad tab: your cloud code, the server connection, and a nudge to keep the code safe
function cloudLine() {
  if (!S) return '';
  const code = myCode(), copied = lsGet(LS.copied);
  const box = code ? `<div class="codebox"><span class="code">${code}</span><button class="sbtn solid" data-act="copyCloud">Copy</button></div>` : '';
  const status = cloud.reason === 'on' ? `Server: connected, synced ${syncedAgo()}.`
    : cloud.reason === 'offline' ? 'Server: offline right now. Your dad keeps going on the server; you\'ll see it when you\'re back online. <button class="sbtn" data-act="cloudRetry">Try again</button>'
    : cloud.reason === 'checking' ? 'Server: connecting...' : `Server: problem (${esc(cloud.err)}). <button class="sbtn" data-act="cloudRetry">Try again</button>`;
  const nudge = copied ? 'Your dad lives on the server. Anyone with this code can play him, so keep it to yourself.'
    : '<b>Copy your cloud code and keep it somewhere safe</b> (a Discord DM to yourself works). It\'s the only key to your dad: type it on any phone and he\'s back.';
  return `<div class="upgrade${copied ? '' : ' warnbox'}"><h3 class="sect">Your cloud code</h3>${box}<p class="small" style="margin-top:8px">${nudge}</p><p class="small" style="margin-top:6px">${status}</p></div>`;
}
function renderCloudBits() {
  const hs = document.getElementById('hsBox'); if (hs) hs.innerHTML = highscoresHTML();
  const cl = document.getElementById('cloudLine'); if (cl) cl.innerHTML = cloudLine();
  const cm = document.getElementById('cloudMsg'); if (cm) cm.textContent = cloudMsg;
}
var installEvt = null;   // var, not let: the Dad tab can render before this line runs
function standalone() { return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function installHTML() {
  if (standalone()) return '';
  if (installEvt) return '<button class="btn alt" style="width:100%;margin-top:12px" data-act="install">Install GFD as an app<small>Own icon, full screen, no browser bars</small></button>';
  if (/iphone|ipad/i.test(navigator.userAgent)) return '<p class="small note" style="margin-top:12px">Want GFD as an app? In Safari tap the Share button, then "Add to Home Screen".</p>';
  return '';
}

/* ---------- staying up to date ----------
   Browsers can keep running an old copy of the game after an update. version.json on GitHub says which
   version is newest: on opening we reload straight away, mid-game we show a tap-to-update bar. */
let updateReady = null;
async function checkVersion(boot) {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const v = (await r.json()).version;
    if (!v || verNum(v) <= verNum(CONFIG.version)) return;
    if (boot && !sessionStorage.getItem('gfd_reloaded_' + v)) { sessionStorage.setItem('gfd_reloaded_' + v, '1'); location.reload(); return; }
    updateReady = v; renderTop();
  } catch (e) {}
}

/* ---------- boot ---------- */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
(function boot() {
  let cached = null; try { cached = JSON.parse(lsGet(LS.cache) || 'null'); } catch (e) {}
  let legacy = null; try { legacy = JSON.parse(lsGet(LS.legacy) || 'null'); } catch (e) {}
  let code = myCode();
  // a save from the old version on this phone: it moves to the server once, under its cloud code
  if (!code && legacy && legacy.xp && !lsGet(LS.moved)) { code = cleanCode(legacy.cloudCode) || newCloudCode(); lsSet(LS.code, code); }
  if (!code) { draft = {name: 'Dad', look: Object.assign({}, DEFAULT_LOOK)}; editing = 'setup'; render(); return; }
  S = cached || (legacy && legacy.xp ? legacy : null);
  if (S) S.tab = lsGet(LS.tab) || S.tab || 'fish';
  render();
  const extra = legacy && legacy.xp && !lsGet(LS.moved) && Date.now() < MOVE_DEADLINE ? {legacy} : null;
  act('sync', {}, null, extra).then(res => {
    if (res && res.ok && extra) { lsSet(LS.moved, now()); }
    if (res && res.ok) { const seen = lsGet(LS.seen) || (legacy && legacy.seenVersion); if (seen !== CONFIG.version) setTimeout(() => showWhatsNew(seen), 400); }
    if (res && !res.ok && res.reason === 'no_dad') { S = null; lsSet(LS.code, null); lsSet(LS.cache, null); draft = {name: 'Dad', look: Object.assign({}, DEFAULT_LOOK)}; editing = 'setup'; render(); }
  });
  loadScores();
  checkVersion(true);
})();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S && S.tab === 'dad' && !editing) renderMain(); });
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
// every second: health ticks up (same maths as the server), timers move. Every 20 seconds, or when a try is due, ask the server.
setInterval(() => {
  if (!S || editing === 'setup') return;
  const hp0 = S.hp; regenTo(now()); renderTop(); if (!editing) updateProgress();
  if (S.hp !== hp0 && S.tab !== 'dad' && !anim) { const a = document.activeElement; if (!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderMain(); }
  if (document.hidden || anim) return;
  const due = S.actAt + actMs(S.activity) < now() - 1000;
  if (now() - cloud.lastSync > 20000 || (due && now() - cloud.lastSync > 5000)) { cloud.lastSync = now(); act('sync'); }
  if (S.tab === 'ranks' && now() - cloud.scoresAt > 60000) loadScores();
  if (Date.now() % 300000 < 1000) checkVersion(false);   // every 5 minutes
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; checkVersion(false); if (S && !editing) { cloud.lastSync = now(); act('sync'); } });
</script>
